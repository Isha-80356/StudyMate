<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>StudyMate</title>
    <script type="text/javascript">
      var segment = 1;
      var l = window.location;
      var p = l.pathname.split('/');
      var repo = p[1];
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' + repo + '/?p=/' + l.pathname.slice(repo.length + 2) + l.search + l.hash);
    </script>
  </head>
  <body></body>
</html>
